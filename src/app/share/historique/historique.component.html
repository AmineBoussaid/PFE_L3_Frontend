
    <!--  Container Star -->
    <div class="container">

      <div class="row mt-3 mb-3">

      <div class="card-header bg-primary rounded text-white shadow">
        <h2 class="p-1 m-2">Historique de l'utilisateur</h2>
      </div>

      <div class="col-12 shadow p-0 py-1 bg-body-tertiary rounded ">
        <div class="card" style="min-height: 500px;">
          <div style="max-height: 500px; overflow-y: auto;">
            <table class="table table-striped-columns">
              <tbody>
                <tr *ngFor="let history of historiques">
                  <td>{{ history.action }}</td>
                  <td>{{ history.details }}</td>
                  <td>{{ formatDate(history.createdAt) }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div *ngIf="historiques.length === 0" class="text-center p-5 fs-4">Votre historique s'affiche ici.</div>
        </div>
      </div>
    </div>



    </div>
    <!--  Container End -->
