
  <!-- Container Start -->
  <div class="container">

    <div class="row">
      <div class="col">
        <h2>Services</h2>
      </div>
      <div class="col">
        2 of 2
      </div>
    </div>

    <div class="row m-3">
      <div class="col shadow p-0  bg-body-tertiary rounded">

        <div class="row m-0 p-0 bg-warning">
          <div class="col col-5">
            <nav class="ms-4" aria-label="Page navigation example" *ngIf="filteredTechniciens.length > 0">
              <ul class="pagination my-2">
                <li class="page-item" [class.disabled]="currentPage === 1">
                  <a class="page-link" aria-label="Previous" (click)="setPage(currentPage - 1)">
                    <span aria-hidden="true">&laquo;</span>
                  </a>
                </li>
                <li class="page-item" *ngFor="let page of [].constructor(Math.ceil(filteredTechniciens.length / itemsPerPage)); let pageIndex = index" [class.active]="currentPage === pageIndex + 1">
                  <a class="page-link" (click)="setPage(pageIndex + 1)">{{ pageIndex + 1 }}</a>
                </li>
                <li class="page-item" [class.disabled]="currentPage === Math.ceil(filteredTechniciens.length / itemsPerPage)">
                  <a class="page-link" aria-label="Next" (click)="setPage(currentPage + 1)">
                    <span aria-hidden="true">&raquo;</span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>

          <div class="col col-7">
            <div class="input-group input-group-sm my-2 shadow-sm">
              <label class="input-group-text" for="statusFilter">Status</label>
              <select class="form-select me-2" id="statusFilter" >
                <option value="">Tous</option>
                <option value="Libre">Libre</option>
                <option value="En Equipe">En Equipe</option>
              </select>

              <input type="text" class="form-control" placeholder="Rechercher" aria-label="Rechercher" aria-describedby="button-addon2" (input)="onSearchChange($event)">
              <label class="input-group-text" for="inputGroupSelect01">Rechercher</label>
            </div>
          </div>
        </div>

        <div class="row mt-2 p-2" style="min-height: 300px;">
          <div *ngFor="let technicien of paginatedTechniciens; let i = index" class="col my-2">
            <div class="card shadow-sm p-1 m-0" style="width: 22rem;">

              <div class="row">
                <div class="col-4">
                  <img src="https://bootdey.com/img/Content/avatar/avatar7.png" class="shadow-sm p-2" style="width: 120%;" alt="{{ technicien.username }}">
                </div>

                <div class="col-8 ">
                  <div class="card-body m-0 p-0">
                    <div class="card-title fs-4 m-0">{{ technicien.username }}</div>
                    <div class="card-text fs-6 m-0">{{ technicien.email }}</div>
                    <div class="card-text fs-6 m-0">{{ technicien.role }}</div>
                  </div>
                </div>
              </div>

              <ul class="list-group list-group-flush m-0 p-0">
                <li class="list-group-item fs-6 m-0 ">{{ technicien.description }}</li>
                <li class="list-group-item fs-6 m-0 ">{{ technicien.serviceName }}</li>
              </ul>

              <div class="card-body text-end m-0 p-1">
                <button class="col-3 btn btn-link p-0" (click)="goToIntervention(technicien)">Intervenir</button>
                <button class="col-3 btn btn-link p-0">Calendrier</button>
                <button class="col-6 btn btn-link p-0" (click)="deleteTS(technicien.userId, serivce_id) ">Liberer</button>

              </div>
            </div>
          </div>
          <div *ngIf="paginatedTechniciens.length === 0" class="text-center p-5">Aucune technicien trouvée.</div>
        </div>

        <div class="row">
          <div class="col">
            <nav class=" ms-4 mt-2" aria-label="Page navigation example" *ngIf="filteredTechniciens.length > 0">
              <ul class="pagination">
                <li class="page-item" [class.disabled]="currentPage === 1">
                  <a class="page-link" aria-label="Previous" (click)="setPage(currentPage - 1)">
                    <span aria-hidden="true">&laquo;</span>
                  </a>
                </li>
                <li class="page-item" *ngFor="let page of [].constructor(Math.ceil(filteredTechniciens.length / itemsPerPage)); let pageIndex = index" [class.active]="currentPage === pageIndex + 1">
                  <a class="page-link" (click)="setPage(pageIndex + 1)">{{ pageIndex + 1 }}</a>
                </li>
                <li class="page-item" [class.disabled]="currentPage === Math.ceil(filteredTechniciens.length / itemsPerPage)">
                  <a class="page-link" aria-label="Next" (click)="setPage(currentPage + 1)">
                    <span aria-hidden="true">&raquo;</span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>



      </div>
    </div>

    <div class="row">
      <div class="col">
        1 of 2
      </div>
      <div class="col">
        2 of 2
      </div>
    </div>


  </div>
  <!-- Container End -->
