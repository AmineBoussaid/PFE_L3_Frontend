
    <!--  Container Star -->
    <div class="container my-4">

      <div class="row">
        <div class="col">
          <h2>Historique</h2>
        </div>
        <div class="col">
          2 of 2
        </div>
      </div>

      <div class="container my-4">
        <div class="card" style="min-height: 500px;">
          <div class="card-header bg-primary text-white">
            <h5 class="p-1">Historique de l'utilisateur</h5>
          </div>
          <div style="max-height: 500px; overflow-y: auto;">
            <table class="table table-striped-columns">
              <tbody>
                <tr *ngFor="let history of historiques">
                  <td>{{ history.action }}</td>
                  <td>{{ history.details }}</td>
                  <td>{{ formatDate(history.created_at) }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div *ngIf="historiques.length === 0" class="text-center p-5 fs-4">Votre historique s'affiche ici.</div>
        </div>
      </div>

      <div class="row">
        <div class="col">
          1 of 2
        </div>
        <div class="col">
          2 of 2
        </div>
      </div>

    </div>
    <!--  Container End -->
