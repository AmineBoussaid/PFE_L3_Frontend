

    <!--  Container Star -->
    <div class="container">

      <div class="row">
        <div class="col">
          <h2>Gestion Service</h2>
        </div>
        <div class="col">
          2 of 2
        </div>
      </div>

      <div class="row mb-2">

        <main class="col-8 p-2 ">

          <div class="my-2 p-3 bg-body rounded shadow-sm">
            <h6 class="border-bottom pb-2 mb-0">Techniciens</h6>

            <div *ngFor="let group of techniciensGrouped.slice(0, 3)" class="row">
              <div *ngFor="let technicien of group" class="col-6 d-flex text-body-secondary pt-3">
                <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false">
                  <title>Placeholder</title>
                  <rect width="100%" height="100%" fill="#007bff"/><text x="50%" y="50%" fill="#ffffff" dy=".3em">{{ technicien.username?.charAt(0) }}</text>
                </svg>
                <p class="pb-3 mb-0 small lh-sm border-bottom">
                  <strong class="d-block text-gray-dark">{{ technicien.username }}</strong>
                  {{ technicien.description }}
                </p>
              </div>
            </div>

            <small class="d-block text-end mt-2">
              <button class="btn btn-link p-0" (click)="AllTechnicians(techniciens)">Show All</button>
            </small>
          </div>




          <div class="my-2 p-3 bg-body rounded shadow-sm">
            <h6 class="border-bottom pb-2 mb-0">Equipes</h6>
            <div class="d-flex text-body-secondary pt-3">
              <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#007bff"/><text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text></svg>
              <div class="pb-3 mb-0 small lh-sm border-bottom w-100">
                <div class="d-flex justify-content-between">
                  <strong class="text-gray-dark">Full Name</strong>
                  <a href="#">Follow</a>
                </div>
                <span class="d-block">username</span>
              </div>
            </div>
            <div class="d-flex text-body-secondary pt-3">
              <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#007bff"/><text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text></svg>
              <div class="pb-3 mb-0 small lh-sm border-bottom w-100">
                <div class="d-flex justify-content-between">
                  <strong class="text-gray-dark">Full Name</strong>
                  <a href="#">Follow</a>
                </div>
                <span class="d-block">username</span>
              </div>
            </div>
            <div class="d-flex text-body-secondary pt-3">
              <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#007bff"/><text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text></svg>
              <div class="pb-3 mb-0 small lh-sm border-bottom w-100">
                <div class="d-flex justify-content-between">
                  <strong class="text-gray-dark">Full Name</strong>
                  <a href="#">Follow</a>
                </div>
                <span class="d-block">username</span>
              </div>
            </div>
            <small class="d-block text-end mt-3">
              <a href="#">All suggestions</a>
            </small>
          </div>
        </main>

        <main class="col p-2">
          <div class="my-2 p-3 bg-body rounded shadow-sm h-100">
            <h4>{{service.nom}} </h4>
          </div>
        </main>

      </div>

      <div class="row">
        <div class="col">
          1 of 2
        </div>
        <div class="col">
          2 of 2
        </div>
      </div>

    </div>
    <!--  Container End -->
